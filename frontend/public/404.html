<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAHKAAR Platform</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts fallback
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace('/' + (path ? '?p=' + encodeURIComponent(path + search + hash) : ''));
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 20%; color: #666;">
      Redirecting to SAHKAAR Platform...
    </p>
  </body>
</html>
